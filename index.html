<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speculative State Recycling</title>
  <style>
    :root {
      --bg: #f6f5f1;
      --ink: #1c1917;
      --muted: #57534e;
      --line: #d6d3d1;
      --accent: #1d4e89;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Source Serif 4", "Times New Roman", Georgia, serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.55;
    }
    main {
      max-width: 42rem;
      margin: 0 auto;
      padding: 4.5rem 1.25rem 5rem;
    }
    p.venue {
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 1rem;
    }
    h1 {
      font-size: 1.85rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 1.25rem;
      line-height: 1.25;
    }
    p.lead {
      font-size: 1.05rem;
      color: var(--muted);
      margin: 0 0 2rem;
    }
    hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 0 0 2rem;
    }
    p { margin: 0 0 1rem; }
    .note {
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <p class="venue">Project page</p>
    <h1>Speculative State Recycling</h1>
    <p class="lead">
      A project page for an anonymous conference submission.
      Materials will be added here without author-identifying information.
    </p>
    <hr>
    <p>
      This site will host paper figures, videos, and supplementary notes.
    </p>
    <p class="note">Placeholder page. Content coming soon.</p>
  </main>
</body>
</html>
